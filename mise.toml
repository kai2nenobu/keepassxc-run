[settings]
unix_default_inline_shell_args = 'bash -o pipefail -e -c'
windows_default_inline_shell_args = '"C:\Program Files\Git\bin\bash.exe" -o pipefail -e -c'

[tools]
uv = "latest"
gh = "latest"

[env]
PYTHONUTF8 = "1"

[vars]
PROJECT = "keepassxc-run"
UV = "uv"
RUFF = "{{vars.UV}} run ruff"
PREK = "{{vars.UV}} run prek"
TOX = '{{vars.UV}} tool run --from "tox>=4,<5" --with tox-uv -- tox run'
# variables for pyinstaller
PYINSTALLER = "{{vars.UV}} run pyinstaller"
PYINSTALLER_FLAGS = '{% if os() != "windows" %}--strip{% endif %}'
executable_name = '{{ vars.PROJECT }}{% if os() == "windows" %}.exe{% endif %}'
archive_file = '''
{{- vars.PROJECT ~ "_" ~ os() ~ "_" ~ arch() -}}
{% if os() == "windows" %}.zip{% else %}.tar.gz{% endif -%}
'''
# variables for KeePassXC
KEEPASSXC = 'C:\Program Files\KeePassXC\KeePassXC.exe'
KEEPASSXC_CLI = 'C:\Program Files\KeePassXC\keepassxc-cli.exe'

[tasks.setup]
description = "Configure a local dev environment. Execute once after cloning"
run = [
    "{{vars.UV}} sync",
    "{{vars.PREK}} install",
]

[tasks.lint]
description = "Lint all files"
run = "{{vars.PREK}} run --all-files --show-diff-on-failure"

[tasks.format]
description = "Format all files"
run = "{{vars.RUFF}} format ."

[tasks.test]
description = "Test on a Python 3.12 environment"
env = { TOX_ENV = "py312" }
run = "{{vars.TOX}}"

[tasks.test-all]
description = "Run all tests including 'required_db' marker"
# Don't use tox because fetching secrets by "git-credential-keepassxc" fails in tox environments
# I don't know why.
run = "{{vars.UV}} run pytest tests -v --cov=src --cov-branch --cov-report=term --cov-report=html"

[tasks.tox]
description = "Test on multiple Python versions using tox"
run = "{{vars.TOX}}"

[tasks.build]
description = "Build a package"
run = "uv build"

[tasks.build-exe]
description = "Build a single executable by pyinstaller"
run = "{{vars.PYINSTALLER}} {{vars.PYINSTALLER_FLAGS}} --onefile ./bin/{{vars.PROJECT}}.py"

[tasks.archive-exe]
description = "Archive a single executable (creates zip on Windows, tar.gz elsewhere)"
depends = "build-exe"
run = '''
mkdir -p archive && cd dist
{% if os() == "windows" %}
pwsh -NoProfile -Command "Compress-Archive -DestinationPath ../archive/{{vars.archive_file}} -LiteralPath {{vars.executable_name}} -Update"
{% else %}
tar cf "../archive/{{vars.archive_file}}" "{{vars.executable_name}}"
{% endif %}
'''

[tasks.upload-archive]
description = "Upload an archive per platform to GitHub release assets"
depends = "archive-exe"
run = '''
if [ -z "$TAG_NAME" ]; then
  echo "TAG_NAME environment variable not set. Export TAG_NAME before running."
  exit 1
fi
gh release upload "$TAG_NAME" archive/*
'''

[tasks.clean]
description = "Clean up generated files"
run = "rm -rf build/ dist/ archive/ || true"

[tasks.restore-db]
description = "Restore the sample KeePassXC database for tests"
run = 'echo "\"restore-db\" task is available on Windows only" && exit 1'
run_windows = '''
rm -f ./tests/data/test_db.kdbx
"{{vars.KEEPASSXC_CLI}}" import --set-key-file ./tests/data/test_db.keyx ./tests/data/test_db.xml ./tests/data/test_db.kdbx
powershell.exe -NoProfile -Command '&"{{vars.KEEPASSXC}}" --config ./tests/data/keepassxc.ini --keyfile ./tests/data/test_db.keyx ./tests/data/test_db.kdbx'
'''
